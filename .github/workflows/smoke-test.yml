name: Pipeline Smoke Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  coverage:
    # Offline coverage gate for the Python code (backend + extraction job +
    # analysis endpoint + eval harness). Fast, no Docker, no network: only the
    # three requirements files + pytest-cov. Fails the PR if total in-scope
    # coverage drops below the threshold. Config: .coveragerc + scripts/coverage.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so diff-cover can compute the PR range against the base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all Python deps (backend + extraction + analysis)
        run: |
          pip install -r backend/requirements.txt
          pip install -r jobs/extraction/requirements.txt
          pip install -r jobs/analysis/requirements-dev.txt
          pip install diff-cover

      - name: Fetch base branch (for diff coverage on PRs)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Run coverage gate (global + diff)
        env:
          COVERAGE_FAIL_UNDER: "85"
          # Diff-coverage gate on PRs only (>= 80% of changed lines). Unset on
          # push/dispatch, so the global gate still runs there.
          DIFF_COVER_COMPARE_BRANCH: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          DIFF_COVER_FAIL_UNDER: "80"
        run: bash scripts/coverage.sh

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  readiness:
    # Machine-checkable submission readiness against the six equal Nebius
    # judging criteria. scripts/readiness.py verifies REAL evidence — the cited
    # symbol is wired into the cited file AND the cited offline test passes —
    # plus an in-process reproduction of the headline EUR 133,381.71 figure.
    # Fails the PR if automatable completeness < 95%. Live-endpoint checks are
    # probed as user-gated only (skipped here with --skip-live), never scored.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all Python deps (backend + extraction + analysis)
        run: |
          pip install -r backend/requirements.txt
          pip install -r jobs/extraction/requirements.txt
          pip install -r jobs/analysis/requirements-dev.txt

      - name: Run readiness gate (offline; fails under 95%)
        run: python scripts/readiness.py --skip-live

      - name: Readiness gate e2e test (asserts the gate runs + offline >= 95%)
        run: python -m pytest scripts/tests/test_readiness_gate.py -q

      - name: Upload readiness.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: readiness.json
          if-no-files-found: warn

  pen-test:
    # Machine-checkable APPLICATION-SECURITY suite (OWASP-relevant surface for
    # this app): authz/authn boundary, injection (path/param + prompt-injection
    # fence), IDOR / period isolation, sensitive-data exposure, and abuse/DoS
    # limits. Real requests + assertions against the actual FastAPI app
    # (TestClient) and the extraction fence — no placeholders. Offline, per-PR.
    #
    # The dependency-CVE gate (pip-audit + npm audit) is the separate "Dependency
    # Audit" workflow (security-audit.yml); test_pentest_sca.py asserts it stays
    # wired + blocking. gitleaks secret-scan runs as the first step of smoke-test
    # below.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend + extraction deps
        run: |
          pip install -r backend/requirements.txt
          pip install -r jobs/extraction/requirements.txt

      - name: Backend pen-test suite (authz · injection · IDOR · exposure · abuse · SCA)
        run: cd backend && python -m pytest tests/test_pentest_*.py -v

      - name: Extraction prompt-injection fence + scanner
        run: cd jobs/extraction && python -m pytest tests/test_pentest_injection_fence.py tests/test_injection_scan.py -v

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /tmp
          /tmp/gitleaks detect --source . --redact --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend unit tests (pytest)
        run: |
          pip install -r backend/requirements.txt
          cd backend && python -m pytest tests/ -v --tb=short

      - name: BFF proxy tests (Firebase function — cold-start liveness gate)
        run: |
          # Guards the /api/health exemption (#115): the BFF must forward the
          # unauthenticated liveness probe to the backend, not 401 it. Uses only
          # httpx (installed above); firebase_functions is stubbed in the test.
          python -m pytest frontend/functions/tests -q

      - name: Evaluation harness — proof of execution + baselines
        run: |
          # offline: scores the real pipeline agents vs ground truth (no network,
          # only pydantic). Asserts the BASELINE.md numbers + that all four
          # validation rules (incl. the now-active R2/R4) fire and are correct.
          python -m pytest eval/tests -q
          python eval/evaluate.py eval/corpus/sample

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend unit tests (Vitest)
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Generate synthetic sample PDFs
        run: |
          pip install reportlab
          python scripts/generate-sample-data.py

      - name: Create .env from secrets
        env:
          NEBIUS_KEY: ${{ secrets.NEBIUS_INFERENCE_API_KEY }}
        run: |
          {
            echo "JOB_RUNNER_BACKEND=local"
            echo "EXTRACTION_SERVICE_URL=http://extraction:8002"
            echo "NEBIUS_BUCKET_NAME=archon-bucket"
            echo "STORAGE_ENDPOINT_URL=http://localstack:4566"
            echo "AWS_ACCESS_KEY_ID=test"
            echo "AWS_SECRET_ACCESS_KEY=test"
            echo "NEBIUS_REGION=us-east-1"
            echo "NEBIUS_INFERENCE_BASE_URL=https://api.studio.nebius.ai/v1"
            echo "NEBIUS_INFERENCE_API_KEY=${NEBIUS_KEY}"
            echo "VISION_MODEL=Qwen/Qwen2.5-VL-72B-Instruct"
            echo "ANALYSIS_MODEL=meta-llama/Llama-3.3-70B-Instruct"
            echo "ANALYSIS_ENDPOINT_URL=http://analysis:8001"
            echo "BACKEND_HOST=0.0.0.0"
            echo "BACKEND_PORT=8000"
            echo "CORS_ORIGINS=http://localhost:3000"
            echo "POSTGRES_HOST="
            echo "POSTGRES_PORT=6432"
            echo "POSTGRES_DB=archon"
            echo "POSTGRES_USER=archon_user"
            echo "POSTGRES_PASSWORD="
            echo "DATABASE_URL="
            echo "NEBIUS_IAM_TOKEN="
            echo "NEBIUS_PROJECT_ID="
            echo "SKIP_AUTH=true"
          } > .env

      - name: Build and start services (backend, extraction, analysis, localstack)
        run: |
          docker compose up --build -d localstack extraction analysis backend
        timeout-minutes: 15

      - name: Wait for all services to be healthy
        run: |
          wait_for() {
            local name=$1 url=$2
            echo "Waiting for $name at $url ..."
            for i in $(seq 1 40); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "  $name is up (attempt $i)"
                return 0
              fi
              sleep 5
            done
            echo "ERROR: $name did not start in time"
            return 1
          }
          wait_for "localstack"  "http://localhost:4566/_localstack/health"
          wait_for "extraction"  "http://localhost:8002/health"
          wait_for "analysis"    "http://localhost:8001/health"
          wait_for "backend"     "http://localhost:8000/health"

      - name: Verify S3 bucket created by init-localstack.sh
        run: |
          pip install awscli -q
          echo "Buckets (created by scripts/init-localstack.sh ready.d hook):"
          aws --endpoint-url=http://localhost:4566 --region us-east-1 s3 ls
          aws --endpoint-url=http://localhost:4566 --region us-east-1 \
              s3 ls s3://archon-bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      - name: Run end-to-end smoke test
        run: bash scripts/test-pipeline.sh
        env:
          BACKEND_URL: http://localhost:8000
          PERIOD: "2026-01"
        timeout-minutes: 25

      - name: Upload pipeline report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: |
            /tmp/archon-report-*.json
          if-no-files-found: ignore

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=100
