name: Generate Canonical Demo Video (v4)

# Builds the fact-reviewed Archon presentation used for the Nebius challenge.
# The previous Playwright tour overstated supplier/payment matching, remittance
# verification, failed-file visibility, and successful AI Jobs execution. The v4
# builder keeps the narration and every visible claim in one reviewed source.

on:
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow edge-tts

      - name: Build fact-reviewed v4 presentation
        run: python scripts/build_video_v4.py

      - name: Set canonical challenge-video path
        run: cp demo/archon-nebius-presentation-v4.mp4 demo/archon-nebius-demo.mp4

      - name: Verify duration, streams, resolution, sync, and decode
        run: |
          python scripts/verify_video_sync.py --mp4 demo/archon-nebius-demo.mp4
          ffmpeg -v error -i demo/archon-nebius-demo.mp4 -map 0:v:0 -f null -
          ffmpeg -v error -i demo/archon-nebius-demo.mp4 -map 0:a:0 -f null -
          sha256sum demo/archon-nebius-demo.mp4

      - name: Upload canonical demo and reviewed source assets
        uses: actions/upload-artifact@v4
        with:
          name: archon-nebius-demo-video-v4
          path: |
            demo/archon-nebius-demo.mp4
            demo/archon-nebius-presentation-v4.mp4
            demo/video-presentation-v4-script.md
            demo/youtube-description-v4.md
            demo/video-v4-work/manifest.json
            demo/video-v4-work/slide-*.png
          retention-days: 14
