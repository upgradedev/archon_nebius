name: List Subnets for Fallback Project

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate fresh Nebius IAM token from service account
        env:
          NEBIUS_SA_KEY_B64: ${{ secrets.NEBIUS_SA_KEY_B64 }}
          NEBIUS_SA_KEY_ID: ${{ secrets.NEBIUS_SA_KEY_ID }}
          NEBIUS_SA_ID: ${{ secrets.NEBIUS_SA_ID }}
        run: |
          pip install nebius==0.3.76 --quiet
          python3 - <<'PYEOF'
          import base64
          import asyncio
          import os
          import tempfile
          import sys

          sa_key_b64 = os.environ["NEBIUS_SA_KEY_B64"]
          sa_key_id = os.environ["NEBIUS_SA_KEY_ID"]
          sa_id = os.environ["NEBIUS_SA_ID"]

          async def main() -> str:
              from nebius.sdk import SDK

              pem = base64.b64decode(sa_key_b64).decode()
              tmp = tempfile.NamedTemporaryFile(mode="w", suffix=".pem", delete=False)
              tmp.write(pem)
              tmp.flush()
              tmp.close()

              sdk = SDK(
                  service_account_private_key_file_name=tmp.name,
                  service_account_public_key_id=sa_key_id,
                  service_account_id=sa_id,
              )
              try:
                  token = await sdk._token_bearer.receiver().fetch(timeout=30)
                  return token.token
              finally:
                  await sdk.close()

          token = asyncio.run(main())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"NEBIUS_DEPLOY_IAM_TOKEN={token}\n")
          PYEOF

      - name: Install Nebius CLI
        run: |
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash
          echo "$HOME/.nebius/bin" >> $GITHUB_PATH

      - name: Authenticate Nebius CLI
        run: |
          mkdir -p ~/.nebius
          cat > ~/.nebius/config.yaml << 'NEBIUS_CONFIG'
          default: ci
          profiles:
              ci:
                  endpoint: api.nebius.cloud
                  auth-type: federation
                  federation-endpoint: auth.nebius.com
                  parent-id: project-e00cncsmpr00e8p6knyvdq
                  tenant-id: tenant-e00e1r6ntpkd0ws76b
          NEBIUS_CONFIG
          cat > ~/.nebius/credentials.yaml << NEBIUS_CREDS
          tokens:
              federation/auth.nebius.com//ci:
                  token: $NEBIUS_DEPLOY_IAM_TOKEN
                  expires_at: 9999999999
          NEBIUS_CREDS

      - name: List subnets of the fallback project
        run: |
          nebius vpc subnet list --parent-id "project-e00cncsmpr00e8p6knyvdq" --format json
