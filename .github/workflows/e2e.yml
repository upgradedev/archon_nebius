name: Exhaustive E2E Pipeline

# The fast per-PR gate is "Pipeline Smoke Test" (smoke-test.yml). This workflow
# is the EXHAUSTIVE end-to-end suite: it drives the stack through the whole
# pipeline (upload -> extract -> link -> validate -> analyze -> report ->
# dashboard) with DEEP CONTENT assertions.
#
# Two jobs:
#   * e2e             — runs the LOCAL, non-billable stack (JOB_RUNNER_BACKEND=
#                       local, SKIP_AUTH=true: no Nebius Jobs/Endpoints compute
#                       spend). It DOES gate PRs so the content assertions block
#                       merges, on push, and weekly. It excludes test_05
#                       (signed-in live) because that needs the real auth-enabled
#                       backend, not the local skip-auth stack.
#   * signed-in-live  — opt-in (workflow_dispatch / schedule only): exercises the
#                       authenticated path against the LIVE backend with the three
#                       E2E_* secrets. Kept off PRs so it never spends on live
#                       uploads per PR.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate synthetic sample PDFs
        run: |
          pip install reportlab -q
          python scripts/generate-sample-data.py

      - name: Create .env (local runner, auth skipped)
        env:
          NEBIUS_KEY: ${{ secrets.NEBIUS_INFERENCE_API_KEY }}
        run: |
          {
            echo "JOB_RUNNER_BACKEND=local"
            echo "EXTRACTION_SERVICE_URL=http://extraction:8002"
            echo "ANALYSIS_SERVICE_URL=http://analysis:8001"
            echo "ANALYSIS_ENDPOINT_URL=http://analysis:8001"
            echo "NEBIUS_BUCKET_NAME=archon-bucket"
            echo "STORAGE_ENDPOINT_URL=http://localstack:4566"
            echo "AWS_ACCESS_KEY_ID=test"
            echo "AWS_SECRET_ACCESS_KEY=test"
            echo "NEBIUS_REGION=us-east-1"
            echo "NEBIUS_INFERENCE_BASE_URL=https://api.studio.nebius.ai/v1"
            echo "NEBIUS_INFERENCE_API_KEY=${NEBIUS_KEY}"
            echo "VISION_MODEL=Qwen/Qwen2.5-VL-72B-Instruct"
            echo "ANALYSIS_MODEL=meta-llama/Llama-3.3-70B-Instruct"
            echo "BACKEND_HOST=0.0.0.0"
            echo "BACKEND_PORT=8000"
            echo "CORS_ORIGINS=http://localhost:3000"
            echo "POSTGRES_HOST="
            echo "POSTGRES_PORT=6432"
            echo "POSTGRES_DB=archon"
            echo "POSTGRES_USER=archon_user"
            echo "POSTGRES_PASSWORD="
            echo "DATABASE_URL="
            echo "NEBIUS_IAM_TOKEN="
            echo "NEBIUS_PROJECT_ID="
            echo "SKIP_AUTH=true"
          } > .env

      - name: Build and start stack
        run: docker compose up --build -d localstack extraction analysis backend
        timeout-minutes: 15

      - name: Wait for services to be healthy
        run: |
          wait_for() {
            echo "Waiting for $1 at $2 ..."
            for i in $(seq 1 48); do
              curl -sf "$2" >/dev/null 2>&1 && { echo "  $1 up (attempt $i)"; return 0; }
              sleep 5
            done
            echo "ERROR: $1 did not start"; return 1
          }
          wait_for localstack http://localhost:4566/_localstack/health
          wait_for extraction http://localhost:8002/health
          wait_for analysis   http://localhost:8001/health
          wait_for backend    http://localhost:8000/health

      - name: Create S3 bucket in LocalStack
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          pip install awscli -q
          aws --endpoint-url=http://localhost:4566 --region us-east-1 s3 mb s3://archon-bucket || true

      - name: Run exhaustive E2E suite
        env:
          BACKEND_URL: http://localhost:8000
          STORAGE_ENDPOINT_URL: http://localhost:4566
          NEBIUS_BUCKET_NAME: archon-bucket
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          NEBIUS_REGION: us-east-1
          E2E_PERIOD: "2026-01"
          E2E_EXTRACT_TIMEOUT_S: "600"
        run: |
          pip install -r e2e/requirements.txt -q
          # test_05 (signed-in live) needs the real auth-enabled backend; it runs
          # in the opt-in signed-in-live job, not against this local skip-auth stack.
          python -m pytest e2e/ -v --ignore=e2e/test_05_signed_in.py --junitxml=/tmp/e2e-results.xml
        timeout-minutes: 25

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: /tmp/e2e-results.xml
          if-no-files-found: ignore

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200

  signed-in-live:
    # Opt-in ONLY (manual dispatch or the weekly schedule) — never on push/PR, so
    # it never spends on live uploads per PR. Exercises the authenticated path
    # (Firebase sign-in -> Bearer token -> /api/upload -> /api/jobs) against the
    # LIVE backend, plus the no-token -> 401 boundary check. Requires three repo
    # secrets: E2E_FIREBASE_API_KEY, E2E_EMAIL, E2E_PASSWORD. Target backend URL
    # comes from the E2E_BACKEND_URL repo variable (falls back to the live host).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate synthetic sample PDFs
        run: |
          pip install reportlab -q
          python scripts/generate-sample-data.py

      - name: Run signed-in live E2E (test_05)
        env:
          BACKEND_URL: ${{ vars.E2E_BACKEND_URL || 'https://archon-api.duckdns.org' }}
          # Path A (headless): a pre-minted Firebase ID token — no Google sign-in
          # call. Path B: email/password (the test mints the token). Either works.
          NEBIUS_E2E_SESSION: ${{ secrets.NEBIUS_E2E_SESSION }}
          E2E_FIREBASE_API_KEY: ${{ secrets.E2E_FIREBASE_API_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_VERIFY_TLS: "false"
        run: |
          if [ -z "$NEBIUS_E2E_SESSION" ] && { [ -z "$E2E_FIREBASE_API_KEY" ] || [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; }; then
            echo "ERROR: signed-in-live needs EITHER the NEBIUS_E2E_SESSION secret"
            echo "(a Firebase ID token) OR E2E_FIREBASE_API_KEY + E2E_EMAIL + E2E_PASSWORD."
            echo "Set one path in repo settings, then re-run this job."
            exit 1
          fi
          pip install -r e2e/requirements.txt -q
          python -m pytest e2e/test_05_signed_in.py -v --junitxml=/tmp/e2e-signed-in.xml

      - name: Upload signed-in results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-signed-in-results
          path: /tmp/e2e-signed-in.xml
          if-no-files-found: ignore
