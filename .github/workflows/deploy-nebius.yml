name: Deploy to Nebius

# Builds 3 images (extraction job, analysis job, backend endpoint)
# and deploys the backend as a Nebius Serverless AI Endpoint (CPU).
# Extraction and analysis run as on-demand Jobs — no persistent endpoint for them.

on:
  push:
    branches:
      - master
    # Only redeploy the backend when something that actually ships in the endpoint
    # or job images changes. Docs, the blog, the README, and frontend UI must NOT
    # trigger a backend redeploy (a redeploy mints a fresh managed URL and re-points
    # the BFF, so it is never free). The deploy workflow itself is intentionally
    # excluded so editing it does not self-trigger; use workflow_dispatch for that.
    paths:
      - 'backend/**'
      - 'jobs/**'
      - 'nebius/**'
      - 'frontend/functions/**'
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Nebius Project ID to deploy to'
        required: false
        default: ''

# Serialize deploys. Each deploy creates a uniquely-named endpoint and then a
# cleanup step deletes every OTHER archon-backend-r* generation. Two deploys
# running at once therefore delete each other's fresh endpoint — a real incident
# (three concurrent runs, from two merge-pushes + a manual dispatch, left ZERO
# endpoints and took the app down). This guard queues deploys so only one mutates
# the endpoint set at a time; cancel-in-progress is false so a mid-flight
# create/cleanup is never interrupted.
concurrency:
  group: deploy-nebius
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: cr.eu-west1.nebius.cloud
      REGISTRY_PROJECT: e01f86ag28zc4gcrvk
      NEBIUS_PROJECT_ID: ${{ github.event.inputs.project_id || vars.NEBIUS_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate fresh Nebius IAM token from service account
        env:
          NEBIUS_SA_KEY_B64: ${{ secrets.NEBIUS_SA_KEY_B64 }}
          NEBIUS_SA_KEY_ID: ${{ secrets.NEBIUS_SA_KEY_ID }}
          NEBIUS_SA_ID: ${{ secrets.NEBIUS_SA_ID }}
        run: |
          pip install nebius==0.3.76 --quiet
          python3 - <<'PYEOF'
          import base64
          import asyncio
          import os
          import tempfile

          sa_key_b64 = os.environ["NEBIUS_SA_KEY_B64"]
          sa_key_id = os.environ["NEBIUS_SA_KEY_ID"]
          sa_id = os.environ["NEBIUS_SA_ID"]

          async def main() -> str:
              from nebius.sdk import SDK

              pem = base64.b64decode(sa_key_b64).decode()
              tmp = tempfile.NamedTemporaryFile(mode="w", suffix=".pem", delete=False)
              tmp.write(pem)
              tmp.flush()
              tmp.close()

              sdk = SDK(
                  service_account_private_key_file_name=tmp.name,
                  service_account_public_key_id=sa_key_id,
                  service_account_id=sa_id,
              )
              try:
                  token = await sdk._token_bearer.receiver().fetch(timeout=30)  # SDK-backed token exchange
                  return token.token
              finally:
                  await sdk.close()

          token = asyncio.run(main())
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"NEBIUS_FRESH_IAM_TOKEN={token}\n")
          print("Fresh Nebius IAM token generated from service account.")
          PYEOF

      - name: Generate deploy token from service-account credentials file
        env:
          NEBIUS_SA_CREDENTIALS: ${{ secrets.NEBIUS_SA_CREDENTIALS }}
        run: |
          if [ -z "$NEBIUS_SA_CREDENTIALS" ]; then
            echo "NEBIUS_SA_CREDENTIALS secret is not set; falling back to NEBIUS_IAM_TOKEN secret." >&2
            exit 0
          fi
          python3 - <<'PYEOF'
          import asyncio
          import base64
          import json
          import os
          import re
          import tempfile

          def credentials_payload() -> str:
              raw = os.environ["NEBIUS_SA_CREDENTIALS"]
              try:
                  json.loads(raw)
                  return raw
              except json.JSONDecodeError:
                  pass

              try:
                  decoded = base64.b64decode(raw).decode()
                  json.loads(decoded)
                  return decoded
              except Exception:
                  pass

              # Some secret stores preserve raw PEM newlines inside the
              # JSON "private-key" field. Escape only that field and leave
              # the rest of the credentials document untouched.
              match = re.search(
                  r'("private-key"\s*:\s*")(.*?)("\s*,\s*"kid")',
                  raw,
                  flags=re.S,
              )
              if not match:
                  raise ValueError("NEBIUS_SA_CREDENTIALS is not valid JSON, base64 JSON, or raw-PEM credentials JSON")
              pem = match.group(2).replace("\\", "\\\\").replace("\r", "").replace("\n", "\\n")
              fixed = raw[:match.start(2)] + pem + raw[match.end(2):]
              json.loads(fixed)
              return fixed

          async def main() -> str:
              from nebius.sdk import SDK

              tmp = tempfile.NamedTemporaryFile(mode="w", suffix=".json", delete=False)
              tmp.write(credentials_payload())
              tmp.flush()
              tmp.close()

              sdk = SDK(credentials_file_name=tmp.name)
              try:
                  token = await sdk._token_bearer.receiver().fetch(timeout=30)
                  return token.token
              finally:
                  await sdk.close()

          token = asyncio.run(main())
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"NEBIUS_DEPLOY_IAM_TOKEN={token}\n")
          print("Deploy token generated from NEBIUS_SA_CREDENTIALS.")
          PYEOF

      - name: Install Nebius CLI
        run: |
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash
          echo "$HOME/.nebius/bin" >> $GITHUB_PATH

      - name: Authenticate Nebius CLI
        env:
          NEBIUS_IAM_TOKEN_SECRET: ${{ secrets.NEBIUS_IAM_TOKEN }}
        run: |
          # Owner (NEBIUS_IAM_TOKEN) FIRST, then SA-derived tokens as fallback.
          # Root cause of every failed deploy Jul 9–13: commit 7d56133 flipped
          # this to SA-token-first. The service account can CREATE the endpoint
          # (control plane accepts it) but the endpoint's backing compute never
          # provisions under the SA identity — the endpoint hangs in
          # PROVISIONING until the CLI times out. Owner-token creates provision
          # to RUNNING in ~5 min (proven: Jul-8 deploy + 3 manual owner creates
          # on 2026-07-13 all RUNNING; every SA-token create 0/N). The SA most
          # likely lacks a compute/provision role (INFERRED, not yet verified —
          # durable follow-up: grant it and re-enable SA-first). Owner tokens
          # expire ~12h, so refresh the NEBIUS_IAM_TOKEN secret before a deploy
          # (WSL: nebius iam get-access-token, filtered — see CLAUDE.md).
          TOKEN="${NEBIUS_IAM_TOKEN_SECRET:-${NEBIUS_DEPLOY_IAM_TOKEN:-$NEBIUS_FRESH_IAM_TOKEN}}"
          if [ -z "$TOKEN" ]; then
            echo "A deploy-capable Nebius token is required for endpoint create/delete permissions." >&2
            exit 1
          fi
          mkdir -p ~/.nebius
          cat > ~/.nebius/config.yaml << 'NEBIUS_CONFIG'
          default: ci
          profiles:
              ci:
                  endpoint: api.nebius.cloud
                  auth-type: federation
                  federation-endpoint: auth.nebius.com
                  parent-id: project-e01mmzejpr00e93rgqgf3q
                  tenant-id: tenant-e00e1r6ntpkd0ws76b
          NEBIUS_CONFIG
          cat > ~/.nebius/credentials.yaml << NEBIUS_CREDS
          tokens:
              federation/auth.nebius.com//ci:
                  token: ${TOKEN}
                  expires_at: 9999999999
          NEBIUS_CREDS

      - name: Preflight Nebius endpoint permissions
        run: |
          set +e
          nebius ai endpoint list \
            --parent-id "$NEBIUS_PROJECT_ID" \
            --format json > /tmp/nebius-endpoints.json 2>/tmp/nebius-endpoint-preflight.err
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "Nebius endpoint permission preflight failed before Docker build/push." >&2
            echo "The deploy token/service account can generate IAM tokens and may access jobs/registry, but it cannot list/create Serverless AI Endpoints." >&2
            echo "Grant the deploy identity permission on the Serverless AI Endpoint appbox returned by Nebius for project $NEBIUS_PROJECT_ID, or replace NEBIUS_IAM_TOKEN/NEBIUS_SA_CREDENTIALS with a deploy-capable identity." >&2
            cat /tmp/nebius-endpoint-preflight.err >&2
            exit "$STATUS"
          fi
          echo "Endpoint permission preflight passed. Existing endpoints:"
          python3 - <<'PYEOF'
          import json
          data = json.load(open("/tmp/nebius-endpoints.json"))
          items = data.get("items", data) if isinstance(data, dict) else data
          if not items:
              print(" - none")
          for item in items:
              print(" -", item.get("id") or item.get("name") or item)
          PYEOF

      - name: Log in to Nebius Container Registry
        run: |
          echo "$NEBIUS_FRESH_IAM_TOKEN" | docker login "$REGISTRY" --username iam --password-stdin

      - name: Build and push extraction job image (GPU)
        run: |
          IMAGE="$REGISTRY/$REGISTRY_PROJECT/archon-extraction:latest"
          docker build -t "$IMAGE" jobs/extraction/
          docker push "$IMAGE"

      - name: Build and push analysis job image (CPU)
        run: |
          IMAGE="$REGISTRY/$REGISTRY_PROJECT/archon-analysis:latest"
          docker build -t "$IMAGE" jobs/analysis/
          docker push "$IMAGE"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push backend endpoint image (GHCR)
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/archon-backend:latest"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          # Context is the repo ROOT so the image also carries jobs/ (the inline
          # runner executes the pipelines as subprocesses when JOB_RUNNER_BACKEND=inline).
          docker build -f backend/Dockerfile.endpoint -t "$IMAGE_LOWER" .
          docker push "$IMAGE_LOWER"
          echo "GHCR_BACKEND_IMAGE=$IMAGE_LOWER" >> $GITHUB_ENV

      - name: Verify SA credentials can list Nebius jobs
        env:
          NEBIUS_SA_KEY_B64: ${{ secrets.NEBIUS_SA_KEY_B64 }}
          NEBIUS_SA_KEY_ID: ${{ secrets.NEBIUS_SA_KEY_ID }}
          NEBIUS_SA_ID: ${{ secrets.NEBIUS_SA_ID }}
          NEBIUS_PROJECT_ID_LADDER: ${{ vars.NEBIUS_PROJECT_ID_LADDER }}
        run: |
          pip install nebius --quiet
          python3 - <<'PYEOF'
          import base64, os, sys, tempfile
          sa_key_b64 = os.environ["NEBIUS_SA_KEY_B64"]
          sa_key_id  = os.environ["NEBIUS_SA_KEY_ID"]
          sa_id      = os.environ["NEBIUS_SA_ID"]
          pem = base64.b64decode(sa_key_b64).decode()
          tmp = tempfile.NamedTemporaryFile(mode="w", suffix=".pem", delete=False)
          tmp.write(pem); tmp.flush(); tmp.close()
          from nebius.sdk import SDK
          from nebius.api.nebius.ai.v1 import JobServiceClient, ListJobsRequest
          sdk = SDK(service_account_private_key_file_name=tmp.name,
                    service_account_public_key_id=sa_key_id,
                    service_account_id=sa_id)
          try:
              svc = JobServiceClient(sdk)
              ladder = [
                  value.strip()
                  for value in os.getenv("NEBIUS_PROJECT_ID_LADDER", "").split(",")
                  if value.strip()
              ]
              projects = list(dict.fromkeys(ladder or [os.environ["NEBIUS_PROJECT_ID"]]))
              for project_id in projects:
                  svc.list(ListJobsRequest(parent_id=project_id)).wait()
                  print(f"SA Jobs permission check: PASSED ({project_id})")
          except Exception as e:
              print(f"SA Jobs permission check: FAILED — {e}", file=sys.stderr)
              sys.exit(1)
          finally:
              sdk.sync_close()
          PYEOF

      # Blue/green: each deploy creates a UNIQUELY NAMED endpoint and only
      # deletes the previous one after the new one is RUNNING and its managed
      # URL resolves. Never reuse an endpoint name: re-creating a name whose previous
      # endpoint died in ERROR/PROVISIONING wedges the platform-side backing
      # application — every subsequent create with that name hangs in
      # PROVISIONING or goes ERROR while identical specs under a fresh name
      # provision in ~5 min (root-caused 2026-07-13 via A/B endpoint clones;
      # the name "archon-backend" itself became undeployable).
      - name: Choose unique backend endpoint name
        run: |
          echo "ENDPOINT_NAME=archon-backend-r${{ github.run_number }}" >> $GITHUB_ENV
          echo "Deploying endpoint: archon-backend-r${{ github.run_number }}"

      - name: Deploy archon-backend (CPU endpoint)
        env:
          NEBIUS_SA_KEY_B64: ${{ secrets.NEBIUS_SA_KEY_B64 }}
          NEBIUS_SA_KEY_ID: ${{ secrets.NEBIUS_SA_KEY_ID }}
          NEBIUS_SA_ID: ${{ secrets.NEBIUS_SA_ID }}
          NEBIUS_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEBIUS_STORAGE_ACCESS_KEY_ID }}
          NEBIUS_STORAGE_SECRET_KEY: ${{ secrets.NEBIUS_STORAGE_SECRET_KEY }}
          NEBIUS_INFERENCE_API_KEY: ${{ secrets.NEBIUS_INFERENCE_API_KEY }}
          NEBIUS_REGISTRY_PASSWORD: ${{ secrets.NEBIUS_REGISTRY_PASSWORD }}
          # Document-at-rest KMS envelope encryption. OFF by default. To enable:
          # create a Nebius KMS symmetric key (`nebius kms symmetric-key create
          # --algorithm aes_256`), grant this deploy service account the KMS
          # encrypter/decrypter role on it, set the DOC_ENCRYPTION_KMS_KEY_ID
          # repo VARIABLE to its id (an identifier, not key material — the key
          # never leaves KMS), and flip DOC_ENCRYPTION_ENABLED to true.
          DOC_ENCRYPTION_ENABLED: ${{ vars.DOC_ENCRYPTION_ENABLED }}
          DOC_ENCRYPTION_KMS_KEY_ID: ${{ vars.DOC_ENCRYPTION_KMS_KEY_ID }}
          NEBIUS_PROJECT_ID_LADDER: ${{ vars.NEBIUS_PROJECT_ID_LADDER }}
          # Per-project Job region/subnet/image configuration. The Endpoint and
          # authoritative storage remain in the primary eu-west1 project; Job
          # candidates may be in other regions and must not inherit that region.
          NEBIUS_PROJECT_CONFIGS: ${{ vars.NEBIUS_PROJECT_CONFIGS }}
          # Managed PostgreSQL connection string. The backend Endpoint is the ONLY
          # component in-VPC that can reach the IP-allowlisted PG cluster, so it is
          # the writer for the relational read-model mirror (services/pg_sync.py).
          # Without this the mirror silently no-ops (best-effort) and the tables
          # stay empty. Must use port 5432 (direct) — 6432 (pgBouncer) is firewalled.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Opt-in AI-Jobs quota pre-flight/selector (repo VARIABLE, default off).
          # Set to "1" once the quota resource name is confirmed on the live tenant.
          JOB_QUOTA_PREFLIGHT: ${{ vars.JOB_QUOTA_PREFLIGHT }}
          NEBIUS_TENANT_ID: ${{ vars.NEBIUS_TENANT_ID }}
          # Job execution backend (repo VARIABLE). Default "nebius" submits AI Jobs;
          # set to "inline" to run extraction/analysis as subprocesses inside the
          # Endpoint (operator-selected emergency fallback when AI Jobs are unavailable).
          # The image carries the
          # job pipelines either way.
          JOB_RUNNER_BACKEND: ${{ vars.JOB_RUNNER_BACKEND }}
        run: |
          SUBNET_ID="vpcsubnet-e01x810n0mmhj19k9b"
          if [ "$NEBIUS_PROJECT_ID" = "project-e00cncsmpr00e8p6knyvdq" ]; then
            SUBNET_ID="vpcsubnet-e00sn2btkrs87k2re4"
          fi
          echo "Selected Subnet ID: $SUBNET_ID"

          # Reach Managed PostgreSQL over its PRIVATE, in-VPC hostname on the DIRECT
          # port 5432. The Endpoint and the PG cluster share VPC
          # vpcnetwork-e01pngnyyg0sx90n7j, so private-rw is routable with NO public-IP
          # allowlist. Use direct 5432 (open); the pgBouncer pooler port 6432 is
          # firewalled and times out even in-VPC on a running cluster (verified
          # 2026-07-14). Only the HOST is swapped (public-rw->private-rw); the secret's
          # :5432 and password are reused verbatim. NB: the earlier "Connection refused"
          # on private-rw:5432 was the cluster being STOPPED, not a wrong port — always
          # confirm cluster state (nebius msp postgresql v1alpha1 cluster get) first.
          DATABASE_URL_PRIVATE="${DATABASE_URL/public-rw/private-rw}"

          # Bounded create: a healthy endpoint returns in ~3-8 min. If the CLI
          # is still blocked after 15 min the endpoint is wedged — dump status
          # + container logs for diagnosis and fail instead of eating the
          # 30-min job timeout with no evidence.
          set +e
          timeout 900 nebius ai endpoint create \
            --name "$ENDPOINT_NAME" \
            --parent-id "$NEBIUS_PROJECT_ID" \
            --image "$GHCR_BACKEND_IMAGE" \
            --container-port 8000 \
            --platform cpu-d3 \
            --preset 4vcpu-16gb \
            --subnet-id "$SUBNET_ID" \
            --env "NEBIUS_SA_KEY_B64=$NEBIUS_SA_KEY_B64" \
            --env "NEBIUS_SA_KEY_ID=$NEBIUS_SA_KEY_ID" \
            --env "NEBIUS_SA_ID=$NEBIUS_SA_ID" \
            --env "NEBIUS_PROJECT_ID=$NEBIUS_PROJECT_ID" \
            --env "NEBIUS_SUBNET_ID=$SUBNET_ID" \
            --env "NEBIUS_BUCKET_NAME=archon-bucket" \
            --env "NEBIUS_REGION=eu-west1" \
            --env "STORAGE_ENDPOINT_URL=https://storage.eu-west1.nebius.cloud" \
            --env "AWS_ACCESS_KEY_ID=$NEBIUS_STORAGE_ACCESS_KEY_ID" \
            --env "AWS_SECRET_ACCESS_KEY=$NEBIUS_STORAGE_SECRET_KEY" \
            --env "NEBIUS_INFERENCE_BASE_URL=https://api.studio.nebius.ai/v1" \
            --env "NEBIUS_INFERENCE_API_KEY=$NEBIUS_INFERENCE_API_KEY" \
            --env "NEBIUS_REGISTRY_PASSWORD=${NEBIUS_REGISTRY_PASSWORD:-}" \
            --env "VISION_MODEL=Qwen/Qwen2.5-VL-72B-Instruct" \
            --env "ANALYSIS_MODEL=meta-llama/Llama-3.3-70B-Instruct" \
            --env "EXTRACTION_JOB_IMAGE=$REGISTRY/$REGISTRY_PROJECT/archon-extraction:latest" \
            --env "EXTRACTION_JOB_PLATFORM=cpu-d3" \
            --env "EXTRACTION_JOB_PRESET=8vcpu-32gb" \
            --env "ANALYSIS_JOB_IMAGE=$REGISTRY/$REGISTRY_PROJECT/archon-analysis:latest" \
            --env "ANALYSIS_JOB_PLATFORM=cpu-d3" \
            --env "ANALYSIS_JOB_PRESET=8vcpu-32gb" \
            --env "JOB_PRESET_LADDER=cpu-d3:8vcpu-32gb,cpu-d3:16vcpu-64gb,cpu-d3:32vcpu-128gb" \
            --env "JOB_PROVISION_PROBE_SECS=25" \
            --env "JOB_QUOTA_PREFLIGHT=${JOB_QUOTA_PREFLIGHT:-}" \
            --env "NEBIUS_TENANT_ID=${NEBIUS_TENANT_ID:-}" \
            --env "DATABASE_URL=${DATABASE_URL_PRIVATE:-}" \
            --env "CORS_ORIGINS=https://archon-pnl.web.app,http://localhost:3000" \
            --env "JOB_RUNNER_BACKEND=${JOB_RUNNER_BACKEND:-nebius}" \
            --env "DOC_ENCRYPTION_ENABLED=$DOC_ENCRYPTION_ENABLED" \
            --env "DOC_ENCRYPTION_KMS_KEY_ID=$DOC_ENCRYPTION_KMS_KEY_ID" \
            --env "NEBIUS_PROJECT_ID_LADDER=$NEBIUS_PROJECT_ID_LADDER" \
            --env "NEBIUS_PROJECT_CONFIGS=$NEBIUS_PROJECT_CONFIGS"
          CREATE_STATUS=$?
          set -e
          if [ "$CREATE_STATUS" -ne 0 ]; then
            echo "Endpoint create failed or timed out (exit $CREATE_STATUS). Diagnostics:" >&2
            EP_ID=$(nebius ai endpoint list --parent-id "$NEBIUS_PROJECT_ID" --format json 2>/dev/null | \
              python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          import os
          for ep in data.get('items', []):
              if ep.get('metadata', {}).get('name') == os.environ['ENDPOINT_NAME']:
                  print(ep['metadata']['id'])
                  break
          " 2>/dev/null || echo "")
            if [ -n "$EP_ID" ]; then
              nebius ai endpoint get --id "$EP_ID" --format json >&2 || true
              echo "--- container logs (if any) ---" >&2
              timeout 30 nebius ai endpoint logs "$EP_ID" --since 1h >&2 || true
              echo "Deleting failed endpoint $EP_ID (the previous endpoint keeps serving)." >&2
              nebius ai endpoint delete --id "$EP_ID" || true
            fi
            exit 1
          fi

      - name: Verify Object Storage round-trip (real region/creds)
        # Catches storage misconfig (e.g. the eu-north1-vs-eu-west1 SigV4 mismatch
        # that produced the /upload 500) at deploy time — the live external
        # dependency the mocked unit tests can't cover.
        env:
          NEBIUS_BUCKET_NAME: archon-bucket
          NEBIUS_REGION: eu-west1
          STORAGE_ENDPOINT_URL: https://storage.eu-west1.nebius.cloud
          AWS_ACCESS_KEY_ID: ${{ secrets.NEBIUS_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NEBIUS_STORAGE_SECRET_KEY }}
        run: |
          pip install boto3 --quiet
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, "backend")
          from services import storage
          key = "raw-docs/_ci_smoke/roundtrip.txt"
          try:
              storage.upload_file(key, b"ci-smoke", "text/plain")
              assert storage.key_exists(key), "uploaded object not found after put"
              storage.delete_key(key)
              print(f"Object Storage round-trip OK (region={storage._region()})")
          except Exception as e:
              print(f"Object Storage round-trip FAILED: {type(e).__name__}: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Wait for RUNNING and resolve the managed HTTPS URL
        run: |
          # A Serverless Endpoint exposes its HTTP container port through a
          # platform-managed HTTPS URL in status.public_endpoints (trusted cert —
          # this replaced the DuckDNS + in-container Caddy self-signed chain).
          # Newer endpoints show `https://<host>`; some legacy endpoints show
          # `IP:port`, so accept either and normalise to an https:// URL.
          BACKEND_URL=""
          for i in $(seq 1 20); do
            STATE_AND_URL=$(nebius ai endpoint list \
              --parent-id "$NEBIUS_PROJECT_ID" \
              --format json 2>/dev/null | \
              python3 -c "
          import sys, json, os, re
          data = json.load(sys.stdin)
          for ep in data.get('items', []):
              if ep.get('metadata', {}).get('name') == os.environ['ENDPOINT_NAME']:
                  st = ep.get('status', {})
                  url = ''
                  for pe in st.get('public_endpoints', []) or []:
                      pe = str(pe).strip()
                      if pe.startswith('http://') or pe.startswith('https://'):
                          url = pe.rstrip('/'); break
                      if re.match(r'^[0-9.]+:\\d+$', pe):
                          url = 'https://' + pe.split(':')[0]; break
                  print((st.get('state') or '') + ' ' + url)
                  break
          " 2>/dev/null || true)
            STATE=$(echo "$STATE_AND_URL" | cut -d' ' -f1)
            BACKEND_URL=$(echo "$STATE_AND_URL" | cut -d' ' -f2)
            echo "  $ENDPOINT_NAME state=$STATE url=${BACKEND_URL:-<none>} (attempt $i/20)"
            if [ "$STATE" = "RUNNING" ] && [ -n "$BACKEND_URL" ]; then
              break
            fi
            if [ "$STATE" = "ERROR" ]; then
              echo "Endpoint went to ERROR after create returned." >&2
              exit 1
            fi
            sleep 15
          done
          if [ "$STATE" != "RUNNING" ] || [ -z "$BACKEND_URL" ]; then
            echo "Endpoint did not reach RUNNING with a managed public URL in time." >&2
            exit 1
          fi
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"
          echo ""
          echo "========================================================"
          echo "Backend deployed successfully!"
          echo "Endpoint: $ENDPOINT_NAME"
          echo "Managed HTTPS URL: $BACKEND_URL"
          echo "========================================================"
          {
            echo "### Backend endpoint is live"
            echo ""
            echo "- Managed HTTPS URL: \`$BACKEND_URL\`"
            echo "- **Action:** set \`NEBIUS_BACKEND_URL=$BACKEND_URL\` on the Firebase function (\`frontend/functions\`) and \`firebase deploy --only functions\` so the BFF forwards \`/api/**\` here."
          } >> "$GITHUB_STEP_SUMMARY"

          # PostgreSQL reachability gate. The read-model mirror (services/pg_sync.py)
          # is best-effort and no-ops when it cannot reach PG, which twice hid a dead
          # mirror (missing DATABASE_URL; then public-rw allowlist blocking the egress
          # — now fixed by connecting over private-rw). Surface it explicitly on every
          # deploy so it can never regress invisibly again. NON-fatal: PG is a
          # non-critical read-model (S3 is the source of truth), so a PG hiccup must
          # not block the backend deploy — but it is loudly reported + summarised.
          echo "--- PostgreSQL reachability from the new Endpoint ---"
          DB_JSON=""
          for i in 1 2 3; do
            DB_JSON=$(curl -s --max-time 25 "${BACKEND_URL}/health/db" || echo '{}')
            echo "  attempt $i: /health/db -> $DB_JSON"
            echo "$DB_JSON" | grep -q '"reachable": *true' && break
            sleep 8
          done
          if echo "$DB_JSON" | grep -q '"reachable": *true'; then
            echo "✅ PostgreSQL reachable from the Endpoint (private-rw) — read-model mirror will write." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::PostgreSQL NOT reachable from the Endpoint — read-model mirror will no-op (best-effort). $DB_JSON"
            echo "⚠️ PostgreSQL NOT reachable from the Endpoint — read-model mirror will no-op. Detail: $DB_JSON" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Repoint the Firebase BFF at the managed URL
        # A Serverless Endpoint's managed HTTPS URL is per-endpoint and changes on
        # every blue/green recreate, so the Firebase BFF (which holds it as
        # NEBIUS_BACKEND_URL) must be re-pointed on every backend deploy — otherwise
        # the live demo 502s against the previous, now-deleted endpoint. This wires
        # that in. Guarded on FIREBASE_SERVICE_ACCOUNT: without it the step is a loud
        # no-op (the deploy still succeeds) that tells you exactly how to repoint by
        # hand, so a missing secret can never silently take the demo down.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL is empty — refusing to repoint the BFF at nothing." >&2
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT not set — BFF NOT repointed; it still targets the previous endpoint."
            {
              echo "### ⚠️ BFF NOT repointed — the live demo is now stale"
              echo ""
              echo "The backend's managed URL is \`$BACKEND_URL\`, but no \`FIREBASE_SERVICE_ACCOUNT\` CI secret is set, so the Firebase function was not redeployed."
              echo "Repoint by hand: put \`NEBIUS_BACKEND_URL=$BACKEND_URL\` in \`frontend/functions/.env\`, then \`cd frontend && firebase deploy --only functions --project archon-pnl\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fb-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fb-sa.json"
          npm install -g firebase-tools >/dev/null 2>&1
          # Firebase's Python (Gen2) deploy locates the Functions SDK via
          # functions/venv — present locally but absent in a fresh CI checkout, so
          # create + populate it here or `firebase deploy` fails with
          # "Missing virtual environment at venv directory".
          python3.12 -m venv frontend/functions/venv 2>/dev/null || python3 -m venv frontend/functions/venv
          frontend/functions/venv/bin/pip install --quiet --upgrade pip
          frontend/functions/venv/bin/pip install --quiet -r frontend/functions/requirements.txt
          printf 'NEBIUS_BACKEND_URL=%s\n' "$BACKEND_URL" > frontend/functions/.env
          echo "Redeploying the BFF function → $BACKEND_URL"
          ( cd frontend && firebase deploy --only functions --project archon-pnl --non-interactive )
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

          # Confirm the live BFF now reaches the NEW backend (cold-start tolerant).
          OK=""
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 40 "https://archon-pnl.web.app/api/health" || echo 000)
            echo "  BFF /api/health attempt $i -> $CODE"
            [ "$CODE" = "200" ] && { OK=1; break; }
            sleep 6
          done
          if [ -n "$OK" ]; then
            echo "✅ BFF repointed — https://archon-pnl.web.app/api/health → 200 (backend $BACKEND_URL)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::BFF redeployed but /api/health is not 200 yet — verify the function manually."
            echo "⚠️ BFF redeployed but /api/health not yet 200 (backend $BACKEND_URL) — verify manually." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean up superseded backend endpoints
        run: |
          # Only after the new endpoint is RUNNING and its managed URL resolves.
          # Sweeps the legacy fixed-name endpoint and older archon-backend-r*
          # generations (including ERROR leftovers from failed deploys).
          nebius ai endpoint list \
            --parent-id "$NEBIUS_PROJECT_ID" \
            --format json 2>/dev/null | \
            python3 -c "
          import sys, json, os
          data = json.load(sys.stdin)
          keep = os.environ['ENDPOINT_NAME']
          for ep in data.get('items', []):
              name = ep.get('metadata', {}).get('name', '')
              if name == keep:
                  continue
              if name == 'archon-backend' or name.startswith('archon-backend-'):
                  print(ep['metadata']['id'] + ' ' + name)
          " | while read -r EP_ID EP_NAME; do
            echo "Deleting superseded endpoint $EP_NAME ($EP_ID)"
            nebius ai endpoint delete --id "$EP_ID" || echo "  (delete failed — clean up manually)"
          done
