name: Browser E2E (Playwright)

# The top of the testing pyramid: a headless-Chromium check of UI *reachability*
# — that the components the app wires together are actually reachable through the
# browser (the class of bug an API-level test cannot see, e.g. a step ported into
# an orphaned component the live modal never renders).
#
# Fully self-contained: NO live backend, NO model calls. Every `/api/**` request
# and Firebase auth call is mocked in-browser via `page.route` (see
# frontend/e2e/fixtures.ts). Kept SEPARATE from the smoke-test PR gate.

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
