name: Keep Endpoint Warm

# The Archon backend runs as a Nebius CPU Serverless AI Endpoint, which scales to
# zero when idle and cold-starts in ~5 minutes. During the judging window that
# cold start would make the first click after an idle period appear broken.
#
# This scheduled job pings the public liveness probe every ~5 minutes. The point
# is only to make a request REACH the endpoint — that traffic is what keeps the
# instance warm. It never fails the run: a 200 (warm), a 401 (auth-gated route),
# a 5xx (mid-cold-start), or a timeout are all "we hit it", which is the goal.
#
# Note: GitHub only runs scheduled workflows from the default branch, and cron is
# best-effort (may drift to 5-15 min under load). Both are fine for keep-warm.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Never let overlapping runs pile up if a ping is slow.
concurrency:
  group: keep-warm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    name: Ping backend liveness probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm the Nebius endpoint
        run: |
          URL="https://archon-pnl.web.app/api/health"
          echo "Pinging $URL to keep the Nebius endpoint warm..."
          # -sS quiet but show errors; --max-time bounds a cold-start hang; never
          # fail the step — hitting the endpoint at all is the whole objective.
          CODE=$(curl -sS --max-time 45 -o /dev/null -w '%{http_code}' "$URL" || echo "000")
          echo "Response code: $CODE (any response — 200/401/5xx/000 — kept it warm)"
          exit 0
