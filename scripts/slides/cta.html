<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { --bg:#0d2b22; --emerald:#34d399; --gray:#9ca3af; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; background: var(--bg); color: #fff;
    font-family: "Segoe UI", "DejaVu Sans", Arial, sans-serif; overflow: hidden;
  }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
          justify-content: center; padding-bottom: 120px; }
  .logo { font-size: 150px; font-weight: 900; letter-spacing: -3px; color: var(--emerald); }
  .tag { font-size: 48px; font-weight: 600; margin-top: 10px; }
  .desc { color: var(--gray); font-size: 30px; margin-top: 22px; max-width: 1100px; text-align: center; line-height: 1.4; }
  .url { font-size: 64px; font-weight: 800; color: var(--emerald); margin-top: 60px; }
  .hash { color: var(--gray); font-size: 28px; margin-top: 28px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Archon</div>
    <div class="tag">The new era of financial intelligence.</div>
    <div class="desc">Every financial document → one consolidated picture: a boardroom-ready P&amp;L, EBITDA, workforce cost and cash — with a measured answer to what is missing and whether your books reconcile.</div>
    <div class="url">archon-pnl.web.app</div>
    <div class="hash">#NebiusServerlessChallenge</div>
  </div>
</body>
</html>
