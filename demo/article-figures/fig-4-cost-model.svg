<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Archon CPU compute and managed inference model</title>
  <desc id="desc">The current deployment runs orchestration and inline pipelines in a CPU AI Endpoint. A dashed target path shows on-demand CPU AI Jobs when quota is available. Both call managed models through the Nebius Inference API, so Archon operates no GPU container.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <style>
      .bg{fill:#fbfcfe}
      .current{fill:#eef4ff;stroke:#356ac3;stroke-width:3}
      .design{fill:#e9f7ef;stroke:#1b7f4b;stroke-width:3;stroke-dasharray:10 7}
      .model{fill:#f4ecff;stroke:#7a3ec8;stroke-width:2}
      .data{fill:#f8fafc;stroke:#667085;stroke-width:2}
      .rule{fill:#fff4cc;stroke:#b88700;stroke-width:2}
      .title{font:700 33px Arial,sans-serif;fill:#101828}
      .sub{font:18px Arial,sans-serif;fill:#475467}
      .h{font:700 21px Arial,sans-serif;fill:#101828}
      .t{font:16px Arial,sans-serif;fill:#344054}
      .big{font:700 27px Arial,sans-serif;fill:#101828}
      .s{font:14px Arial,sans-serif;fill:#475467}
      .ok{font:700 14px Arial,sans-serif;fill:#067647}
      .limit{font:700 14px Arial,sans-serif;fill:#7a3ec8}
      .arrow{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#1b7f4b;stroke-width:3;fill:none;stroke-dasharray:9 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="850"/>
  <text class="title" x="55" y="58">No Application GPU: Current and Designed Compute Modes</text>
  <text class="sub" x="55" y="92">This diagram describes resource placement, not an unverified per-run cost claim.</text>

  <rect class="current" x="70" y="155" width="390" height="240" rx="18"/>
  <text class="h" x="105" y="199">Observed live compute</text>
  <text class="big" x="105" y="245">CPU AI Endpoint</text>
  <text class="t" x="105" y="283">FastAPI orchestration</text>
  <text class="t" x="105" y="313">Inline extraction subprocess</text>
  <text class="t" x="105" y="343">Inline analysis subprocess</text>
  <text class="ok" x="105" y="374">RUNNING · JOB_RUNNER_BACKEND=inline</text>

  <rect class="design" x="535" y="135" width="365" height="125" rx="18"/>
  <text class="h" x="570" y="176">Designed on demand</text>
  <text class="big" x="570" y="218">Extraction AI Job</text>
  <rect class="design" x="535" y="305" width="365" height="125" rx="18"/>
  <text class="h" x="570" y="346">Designed on demand</text>
  <text class="big" x="570" y="388">Analysis AI Job</text>
  <text class="limit" x="575" y="465">Implemented/tested · CPU Jobs quota 0 · no successful Job run</text>

  <rect class="model" x="985" y="190" width="345" height="195" rx="18"/>
  <text class="h" x="1020" y="235">Nebius Inference API</text>
  <text class="t" x="1020" y="278">Qwen2.5-VL for vision</text>
  <text class="t" x="1020" y="310">Llama 3.3 for narrative</text>
  <text class="s" x="1020" y="348">Managed model execution</text>

  <line class="arrow" x1="460" y1="275" x2="985" y2="275"/>
  <line class="dash" x1="460" y1="225" x2="535" y2="198"/>
  <line class="dash" x1="460" y1="325" x2="535" y2="368"/>
  <line class="dash" x1="900" y1="198" x2="985" y2="255"/>
  <line class="dash" x1="900" y1="368" x2="985" y2="320"/>

  <rect class="data" x="90" y="530" width="370" height="115" rx="16"/>
  <text class="h" x="125" y="574">Object Storage + PostgreSQL</text>
  <text class="t" x="125" y="607">Artifacts and relational read model</text>
  <text class="s" x="125" y="631">Shared contracts across both modes</text>

  <rect class="data" x="515" y="530" width="370" height="115" rx="16"/>
  <text class="h" x="550" y="574">Nebius Container Registry</text>
  <text class="t" x="550" y="607">Extraction + analysis Job images</text>
  <text class="s" x="550" y="631">Endpoint backend image is on GHCR</text>

  <rect class="rule" x="940" y="520" width="390" height="135" rx="16"/>
  <text class="h" x="975" y="565">Resource-placement rule</text>
  <text class="big" x="975" y="608">GPU stays in inference</text>
  <text class="s" x="975" y="635">No GPU in Archon containers</text>

  <text class="t" x="90" y="735">Today: one CPU Endpoint runs orchestration and both packages; model calls use managed inference.</text>
  <text class="t" x="90" y="772">With CPU Jobs quota: the packages can move to on-demand Jobs without changing their agents or artifact contracts.</text>
  <text class="s" x="90" y="812">Solid path = observed deployment. Dashed path = implemented target architecture, currently blocked by quota.</text>
</svg>
