<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Archon CPU orchestration, on-demand AI Jobs, and managed inference placement</title>
  <desc id="desc">The live r133 CPU AI Endpoint orchestrates on-demand extraction and analysis AI Jobs through three project-local routes. Managed GPU inference remains behind the Nebius Inference API. Inline subprocess execution is only an emergency fallback. Deployment succeeded, while application Job runtime and cost remain unmeasured because no application Job completion is claimed.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <style>
      .bg{fill:#fbfcfe}
      .endpoint{fill:#eef4ff;stroke:#356ac3;stroke-width:3}
      .job{fill:#e9f7ef;stroke:#1b7f4b;stroke-width:2.5}
      .model{fill:#f4ecff;stroke:#7a3ec8;stroke-width:3}
      .route{fill:#f8fafc;stroke:#667085;stroke-width:2}
      .data{fill:#f8fafc;stroke:#98a2b3;stroke-width:2}
      .proof{fill:#e9f7ef;stroke:#1b7f4b;stroke-width:2}
      .boundary{fill:#fff4cc;stroke:#b88700;stroke-width:2}
      .title{font:700 32px Arial,sans-serif;fill:#101828}
      .sub{font:17px Arial,sans-serif;fill:#475467}
      .h{font:700 20px Arial,sans-serif;fill:#101828}
      .t{font:15px Arial,sans-serif;fill:#344054}
      .big{font:700 25px Arial,sans-serif;fill:#101828}
      .s{font:13px Arial,sans-serif;fill:#475467}
      .ok{font:700 14px Arial,sans-serif;fill:#067647}
      .warn{font:700 14px Arial,sans-serif;fill:#b54708}
      .code{font:700 13px Consolas,monospace;fill:#175cd3}
      .routeText{font:13px Consolas,monospace;fill:#344054}
      .arrow{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" width="1400" height="850"/>
  <text class="title" x="50" y="52">CPU Orchestration + On-Demand Jobs + Managed GPU Inference</text>
  <text class="sub" x="50" y="82">Resource placement and evidence boundaries — not an unverified per-run cost claim.</text>

  <rect class="endpoint" x="55" y="135" width="380" height="255" rx="18"/>
  <text class="h" x="90" y="178">Always-on control plane</text>
  <text class="big" x="90" y="222">CPU AI Endpoint</text>
  <text class="t" x="90" y="260">FastAPI orchestration</text>
  <text class="t" x="90" y="290">Revision r133 · RUNNING</text>
  <text class="code" x="90" y="322">JOB_RUNNER_BACKEND=nebius</text>
  <text class="s" x="90" y="356">Continuously billed while running</text>
  <text class="ok" x="90" y="380">LIVE DEPLOYMENT CONFIGURATION</text>

  <text class="h" x="545" y="128">On-demand CPU work</text>
  <rect class="job" x="510" y="150" width="390" height="110" rx="16"/>
  <text class="big" x="545" y="193">Extraction AI Job</text>
  <text class="t" x="545" y="229">On-demand compute · runtime unmeasured</text>
  <rect class="job" x="510" y="285" width="390" height="110" rx="16"/>
  <text class="big" x="545" y="328">Analysis AI Job</text>
  <text class="t" x="545" y="364">On-demand compute · runtime unmeasured</text>

  <rect class="model" x="975" y="135" width="370" height="255" rx="18"/>
  <text class="h" x="1010" y="178">Managed model layer</text>
  <text class="big" x="1010" y="222">Nebius Inference API</text>
  <text class="t" x="1010" y="264">Qwen2.5-VL for vision</text>
  <text class="t" x="1010" y="296">Llama 3.3 for narrative</text>
  <text class="s" x="1010" y="340">Usage-priced managed execution</text>
  <text class="ok" x="1010" y="370">GPU STAYS IN INFERENCE</text>

  <line class="arrow" x1="435" y1="245" x2="510" y2="205"/>
  <line class="arrow" x1="435" y1="300" x2="510" y2="340"/>
  <line class="arrow" x1="900" y1="205" x2="975" y2="245"/>
  <line class="arrow" x1="900" y1="340" x2="975" y2="300"/>

  <rect class="data" x="55" y="455" width="380" height="150" rx="16"/>
  <text class="h" x="90" y="497">Shared service contracts</text>
  <text class="t" x="90" y="532">Object Storage · authoritative artifacts</text>
  <text class="t" x="90" y="561">PostgreSQL · best-effort read model</text>
  <text class="t" x="90" y="590">Container Registry · Job images</text>

  <rect class="route" x="510" y="445" width="390" height="170" rx="16"/>
  <text class="h" x="545" y="483">Project-local Job routes</text>
  <text class="routeText" x="545" y="519">e00 · eu-north1 · local subnet</text>
  <text class="routeText" x="545" y="549">e01 · eu-west1  · local subnet</text>
  <text class="routeText" x="545" y="579">e03 · uk-south1 · local subnet</text>
  <text class="s" x="545" y="603">Bounded provisioning failover, not generic HA</text>

  <rect class="boundary" x="975" y="455" width="370" height="150" rx="16"/>
  <text class="h" x="1010" y="497">Measured-cost boundary</text>
  <text class="warn" x="1010" y="532">NO COMPLETED APPLICATION JOB YET</text>
  <text class="t" x="1010" y="561">Job duration and per-run cost remain</text>
  <text class="t" x="1010" y="588">projected until an app Job completes.</text>

  <rect class="proof" x="55" y="665" width="620" height="100" rx="16"/>
  <text class="h" x="88" y="703">Deployment evidence</text>
  <text class="ok" x="88" y="734">r133 RUNNING · Jobs backend configured · deploy succeeded</text>
  <text class="s" x="88" y="755">This proves live orchestration configuration, not application Job completion.</text>

  <rect class="boundary" x="725" y="665" width="620" height="100" rx="16"/>
  <text class="h" x="758" y="703">Emergency continuity option</text>
  <text class="code" x="758" y="734">JOB_RUNNER_BACKEND=inline</text>
  <text class="s" x="1000" y="734">Operator-selected fallback only; not live r133 mode</text>
  <text class="s" x="758" y="755">If selected, it consumes the already-running Endpoint's CPU resources.</text>

  <text class="s" x="50" y="820">The live architecture keeps application containers CPU-only and places GPU execution behind the managed Inference API.</text>
</svg>
