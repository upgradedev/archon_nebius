<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Payroll reconciliation event linking</title>
  <desc id="desc">Diagram showing bank net salary, payroll register employer cost, and payslips linked into one payroll event to reconcile the full employer cost.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <style>
      .bg{fill:#fbfcfe}
      .doc{fill:#eef4ff;stroke:#356ac3;stroke-width:2}
      .event{fill:#e9f7ef;stroke:#1b7f4b;stroke-width:2}
      .warn{fill:#fff1f3;stroke:#c01048;stroke-width:2}
      .money{fill:#fff4cc;stroke:#b88700;stroke-width:2}
      .title{font:700 34px Arial, sans-serif;fill:#101828}
      .h{font:700 22px Arial, sans-serif;fill:#101828}
      .t{font:17px Arial, sans-serif;fill:#344054}
      .big{font:700 42px Arial, sans-serif;fill:#101828}
      .red{fill:#c01048}
      .green{fill:#067647}
      .arrow{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="850"/>
  <text class="title" x="60" y="70">Why Payroll Needs Event Linking</text>
  <rect class="doc" x="80" y="160" width="310" height="120" rx="14"/>
  <text class="h" x="110" y="202">Bank confirmation</text>
  <text class="t" x="110" y="234">Net salary transfer</text>
  <text class="big" x="110" y="270">EUR 1,000</text>
  <rect class="doc" x="80" y="345" width="310" height="135" rx="14"/>
  <text class="h" x="110" y="388">Payroll register</text>
  <text class="t" x="110" y="420">Gross + employer contributions</text>
  <text class="big" x="110" y="462">EUR 1,720</text>
  <rect class="doc" x="80" y="545" width="310" height="120" rx="14"/>
  <text class="h" x="110" y="587">Payslips</text>
  <text class="t" x="110" y="619">Employee-level salary records</text>
  <text class="t" x="110" y="648">Audit trail for totals</text>
  <rect class="event" x="545" y="300" width="330" height="220" rx="18"/>
  <text class="h" x="585" y="350">EventLinkerAgent</text>
  <text class="t" x="585" y="386">Groups documents by</text>
  <text class="t" x="585" y="414">company + period</text>
  <text class="h" x="585" y="470">One PayrollEvent</text>
  <line class="arrow" x1="390" y1="220" x2="545" y2="355"/>
  <line class="arrow" x1="390" y1="412" x2="545" y2="410"/>
  <line class="arrow" x1="390" y1="604" x2="545" y2="465"/>
  <rect class="money" x="1015" y="165" width="310" height="130" rx="14"/>
  <text class="h" x="1045" y="207">Cash-flow signal</text>
  <text class="big" x="1045" y="260">EUR 1,000</text>
  <rect class="money" x="1015" y="360" width="310" height="140" rx="14"/>
  <text class="h" x="1045" y="402">P&amp;L payroll cost</text>
  <text class="big green" x="1045" y="462">EUR 1,720</text>
  <rect class="warn" x="1015" y="565" width="310" height="125" rx="14"/>
  <text class="h" x="1045" y="608">Employer delta</text>
  <text class="big red" x="1045" y="662">EUR 720</text>
  <line class="arrow" x1="875" y1="410" x2="1015" y2="230"/>
  <line class="arrow" x1="875" y1="410" x2="1015" y2="430"/>
  <line class="arrow" x1="875" y1="410" x2="1015" y2="625"/>
  <text class="t" x="80" y="760">Without linking, software either sees only the net-wages component from bank data or double counts unrelated payroll documents.</text>
</svg>
