<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Archon live Nebius AI Jobs dispatch architecture</title>
  <desc id="desc">The live r133 CPU AI Endpoint runs FastAPI with JOB_RUNNER_BACKEND set to nebius and dispatches extraction and analysis AI Jobs through three explicit project-local routes. Inline subprocess execution is an emergency fallback only. The deployment succeeded, but no application Job completion is claimed.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <style>
      .bg{fill:#f7f9fc}
      .zone{fill:#ffffff;stroke:#d0d5dd;stroke-width:2}
      .firebase{fill:#fff4cc;stroke:#b88700;stroke-width:2}
      .endpoint{fill:#eef4ff;stroke:#356ac3;stroke-width:3}
      .router{fill:#e9f7ef;stroke:#1b7f4b;stroke-width:3}
      .route{fill:#f8fafc;stroke:#667085;stroke-width:2}
      .job{fill:#f4ecff;stroke:#7a3ec8;stroke-width:3}
      .fallback{fill:#fff7ed;stroke:#c2410c;stroke-width:2;stroke-dasharray:9 7}
      .evidence{fill:#fff4cc;stroke:#b88700;stroke-width:2}
      .support{fill:#f8fafc;stroke:#98a2b3;stroke-width:1.5}
      .title{font:700 31px Arial,sans-serif;fill:#101828}
      .sub{font:17px Arial,sans-serif;fill:#475467}
      .h{font:700 20px Arial,sans-serif;fill:#101828}
      .t{font:15px Arial,sans-serif;fill:#344054}
      .s{font:13px Arial,sans-serif;fill:#475467}
      .ok{font:700 14px Arial,sans-serif;fill:#067647}
      .warn{font:700 14px Arial,sans-serif;fill:#b54708}
      .code{font:700 13px Consolas,monospace;fill:#175cd3}
      .routeName{font:700 15px Arial,sans-serif;fill:#101828}
      .routeId{font:13px Consolas,monospace;fill:#475467}
      .arrow{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .fallbackArrow{stroke:#c2410c;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <text class="title" x="50" y="52">Archon: Live Nebius AI Jobs Dispatch Architecture</text>
  <text class="sub" x="50" y="82">Revision r133 makes the Endpoint the orchestrator and AI Jobs the configured execution backend.</text>

  <rect class="zone" x="45" y="110" width="280" height="675" rx="18"/>
  <text class="h" x="72" y="148">Public browser edge</text>
  <rect class="firebase" x="78" y="180" width="214" height="95" rx="14"/>
  <text class="h" x="105" y="218">React Frontend</text>
  <text class="t" x="105" y="247">Firebase Hosting</text>
  <rect class="firebase" x="78" y="330" width="214" height="120" rx="14"/>
  <text class="h" x="105" y="370">Firebase BFF</text>
  <text class="t" x="105" y="400">Browser TLS + /api/**</text>
  <text class="s" x="105" y="427">Authenticated request proxy</text>
  <line class="arrow" x1="185" y1="275" x2="185" y2="330"/>
  <text class="s" x="78" y="735">The browser edge stays on Firebase.</text>
  <text class="s" x="78" y="757">Compute and data services run on Nebius.</text>

  <rect class="zone" x="355" y="110" width="1000" height="675" rx="18"/>
  <text class="h" x="385" y="148">Nebius services</text>

  <rect class="endpoint" x="395" y="170" width="360" height="145" rx="14"/>
  <text class="h" x="425" y="207">FastAPI orchestrator</text>
  <text class="t" x="425" y="237">CPU AI Endpoint · r133 · RUNNING</text>
  <text class="code" x="425" y="266">JOB_RUNNER_BACKEND=nebius</text>
  <text class="ok" x="425" y="294">DEPLOY 29453848235 SUCCEEDED</text>

  <rect class="router" x="395" y="365" width="360" height="170" rx="14"/>
  <text class="h" x="425" y="403">Bounded Jobs router</text>
  <text class="t" x="425" y="434">Quota preflight + preset ladder</text>
  <text class="t" x="425" y="463">Project → region → subnet selection</text>
  <text class="t" x="425" y="492">Dispatches separate extraction and</text>
  <text class="t" x="425" y="516">analysis CreateJobRequest calls</text>

  <rect class="fallback" x="395" y="585" width="360" height="95" rx="14"/>
  <text class="h" x="425" y="619">Emergency fallback only</text>
  <text class="code" x="425" y="648">JOB_RUNNER_BACKEND=inline</text>
  <text class="s" x="425" y="670">Operator-selected; not the live r133 mode</text>

  <rect class="route" x="805" y="155" width="505" height="235" rx="16"/>
  <text class="h" x="835" y="193">Project-local provisioning routes</text>
  <line x1="835" y1="211" x2="1280" y2="211" stroke="#e4e7ec" stroke-width="2"/>
  <text class="routeName" x="835" y="240">e00 · eu-north1</text>
  <text class="routeId" x="1015" y="240">vpcsubnet-e00sn2btkrs87k2re4</text>
  <text class="routeName" x="835" y="292">e01 · eu-west1</text>
  <text class="routeId" x="1015" y="292">vpcsubnet-e01x810n0mmhj19k9b</text>
  <text class="routeName" x="835" y="344">e03 · uk-south1</text>
  <text class="routeId" x="1015" y="344">vpcsubnet-e03w9xd3nbg2abq7qb</text>
  <text class="s" x="835" y="375">Bounded provisioning failover — not generic high availability</text>

  <rect class="job" x="805" y="440" width="235" height="125" rx="14"/>
  <text class="h" x="832" y="478">Extraction AI Job</text>
  <text class="t" x="832" y="508">CPU · on demand</text>
  <text class="s" x="832" y="535">4-agent package</text>
  <rect class="job" x="1075" y="440" width="235" height="125" rx="14"/>
  <text class="h" x="1102" y="478">Analysis AI Job</text>
  <text class="t" x="1102" y="508">CPU · on demand</text>
  <text class="s" x="1102" y="535">7-agent package</text>

  <rect class="evidence" x="805" y="600" width="505" height="80" rx="14"/>
  <text class="warn" x="835" y="631">EVIDENCE BOUNDARY</text>
  <text class="t" x="835" y="659">Live Jobs-mode deploy succeeded; no completed application Job yet.</text>

  <rect class="support" x="395" y="715" width="205" height="48" rx="11"/>
  <text class="s" x="418" y="744">Object Storage · artifacts</text>
  <rect class="support" x="615" y="715" width="205" height="48" rx="11"/>
  <text class="s" x="638" y="744">Inference API · models</text>
  <rect class="support" x="835" y="715" width="205" height="48" rx="11"/>
  <text class="s" x="858" y="744">PostgreSQL · read model</text>
  <rect class="support" x="1055" y="715" width="255" height="48" rx="11"/>
  <text class="s" x="1078" y="744">Container Registry · Job images</text>

  <line class="arrow" x1="292" y1="390" x2="395" y2="240"/>
  <line class="arrow" x1="575" y1="315" x2="575" y2="365"/>
  <line class="arrow" x1="755" y1="450" x2="805" y2="275"/>
  <path class="arrow" d="M1057 390 L1057 414 L922 414 L922 440"/>
  <path class="arrow" d="M1057 390 L1057 414 L1192 414 L1192 440"/>
  <path class="fallbackArrow" d="M575 535 L575 585"/>

  <line class="arrow" x1="55" y1="835" x2="115" y2="835"/>
  <text class="t" x="130" y="841">Live configured dispatch path</text>
  <line class="fallbackArrow" x1="390" y1="835" x2="450" y2="835"/>
  <text class="t" x="465" y="841">Emergency operator-selected fallback</text>
  <text class="s" x="55" y="875">Deployment evidence covers r133 orchestration and configuration; application Job completion remains unclaimed.</text>
</svg>
