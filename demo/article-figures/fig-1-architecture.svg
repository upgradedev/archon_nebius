<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Archon deployed architecture and designed AI Jobs path</title>
  <desc id="desc">The observed live path runs a FastAPI CPU Endpoint and isolated inline extraction and analysis subprocesses. A separate dashed path shows the implemented Nebius AI Jobs design, which could not provision because this tenant has zero CPU Jobs quota.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <style>
      .bg{fill:#f7f9fc}
      .zone{fill:#ffffff;stroke:#d0d5dd;stroke-width:2}
      .firebase{fill:#fff4cc;stroke:#b88700;stroke-width:2}
      .endpoint{fill:#eef4ff;stroke:#356ac3;stroke-width:2}
      .live{fill:#e9f7ef;stroke:#1b7f4b;stroke-width:3}
      .design{fill:#f4ecff;stroke:#7a3ec8;stroke-width:3;stroke-dasharray:10 7}
      .data{fill:#f8fafc;stroke:#667085;stroke-width:2}
      .model{fill:#f4ecff;stroke:#7a3ec8;stroke-width:2}
      .title{font:700 31px Arial,sans-serif;fill:#101828}
      .h{font:700 21px Arial,sans-serif;fill:#101828}
      .t{font:16px Arial,sans-serif;fill:#344054}
      .s{font:14px Arial,sans-serif;fill:#475467}
      .ok{font:700 14px Arial,sans-serif;fill:#067647}
      .limit{font:700 14px Arial,sans-serif;fill:#7a3ec8}
      .arrow{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#7a3ec8;stroke-width:3;fill:none;stroke-dasharray:9 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text class="title" x="55" y="58">Archon: Deployed Path vs Designed Nebius AI Jobs Path</text>

  <rect class="zone" x="50" y="95" width="330" height="675" rx="18"/>
  <text class="h" x="80" y="135">Public browser edge</text>
  <rect class="firebase" x="90" y="175" width="250" height="105" rx="14"/>
  <text class="h" x="120" y="216">React Frontend</text>
  <text class="t" x="120" y="245">Firebase Hosting</text>
  <rect class="firebase" x="90" y="335" width="250" height="120" rx="14"/>
  <text class="h" x="120" y="376">Firebase BFF</text>
  <text class="t" x="120" y="405">Browser TLS + /api/**</text>
  <text class="s" x="120" y="431">Proxies authenticated requests</text>
  <line class="arrow" x1="215" y1="280" x2="215" y2="335"/>

  <rect class="zone" x="410" y="95" width="940" height="675" rx="18"/>
  <text class="h" x="440" y="135">Nebius services</text>

  <rect class="endpoint" x="450" y="165" width="330" height="135" rx="14"/>
  <text class="h" x="480" y="205">FastAPI Backend</text>
  <text class="t" x="480" y="235">CPU AI Endpoint · RUNNING</text>
  <text class="s" x="480" y="263">Endpoint image pulled from GHCR</text>
  <text class="ok" x="480" y="286">OBSERVED IN PUBLIC DEPLOYMENT RUN</text>

  <rect class="live" x="450" y="360" width="330" height="150" rx="14"/>
  <text class="h" x="480" y="401">Live execution mode</text>
  <text class="t" x="480" y="431">Extraction → analysis packages</text>
  <text class="t" x="480" y="458">Isolated Endpoint subprocesses</text>
  <text class="ok" x="480" y="488">JOB_RUNNER_BACKEND=inline</text>

  <rect class="design" x="450" y="575" width="330" height="145" rx="14"/>
  <text class="h" x="480" y="615">Designed AI Jobs mode</text>
  <text class="t" x="480" y="645">Extraction Job → Analysis Job</text>
  <text class="t" x="480" y="672">Submission path + images tested</text>
  <text class="limit" x="480" y="700">0 CPU quota · no successful Job run</text>

  <rect class="data" x="860" y="155" width="410" height="100" rx="14"/>
  <text class="h" x="890" y="195">Object Storage</text>
  <text class="t" x="890" y="226">Raw, extracted, reviewed, and report artifacts</text>

  <rect class="model" x="860" y="295" width="410" height="110" rx="14"/>
  <text class="h" x="890" y="335">Nebius Inference API</text>
  <text class="t" x="890" y="365">Qwen2.5-VL vision · Llama 3.3 narrative</text>
  <text class="s" x="890" y="389">Managed models; no GPU in Archon containers</text>

  <rect class="data" x="860" y="445" width="410" height="100" rx="14"/>
  <text class="h" x="890" y="485">Managed PostgreSQL</text>
  <text class="t" x="890" y="516">Best-effort relational read model</text>

  <rect class="data" x="860" y="585" width="410" height="110" rx="14"/>
  <text class="h" x="890" y="625">Nebius Container Registry</text>
  <text class="t" x="890" y="655">Extraction + analysis Job images only</text>
  <text class="s" x="890" y="681">Backend Endpoint image is hosted on GHCR</text>

  <line class="arrow" x1="340" y1="395" x2="450" y2="232"/>
  <line class="arrow" x1="615" y1="300" x2="615" y2="360"/>
  <path class="dash" d="M500 300 L425 330 L425 647 L450 647"/>
  <line class="arrow" x1="780" y1="425" x2="860" y2="205"/>
  <line class="arrow" x1="780" y1="425" x2="860" y2="350"/>
  <line class="arrow" x1="780" y1="430" x2="860" y2="495"/>
  <line class="dash" x1="780" y1="645" x2="860" y2="350"/>
  <line class="dash" x1="860" y1="640" x2="780" y2="645"/>

  <line class="arrow" x1="65" y1="815" x2="125" y2="815"/>
  <text class="t" x="140" y="821">Observed live path</text>
  <line class="dash" x1="390" y1="815" x2="450" y2="815"/>
  <text class="t" x="465" y="821">Implemented design path, unavailable on this tenant</text>
  <text class="s" x="65" y="861">Precise claim: Firebase is the browser edge; Nebius runs the live backend, inference, storage, and data services. AI Jobs are the implemented target execution mode, not a completed run.</text>
</svg>
