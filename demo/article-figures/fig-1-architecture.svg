<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Archon architecture</title>
  <desc id="desc">Architecture diagram showing Firebase frontend and BFF connected to Nebius AI Endpoint, AI Jobs, Object Storage, Inference API, Container Registry, and Managed PostgreSQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <style>
      .bg{fill:#f7f9fc}
      .zone{fill:#ffffff;stroke:#d0d5dd;stroke-width:2}
      .firebase{fill:#fff4cc;stroke:#b88700;stroke-width:2}
      .nebius{fill:#e9f7ef;stroke:#1b7f4b;stroke-width:2}
      .data{fill:#eef4ff;stroke:#356ac3;stroke-width:2}
      .model{fill:#f4ecff;stroke:#7a3ec8;stroke-width:2}
      .title{font:700 32px Arial, sans-serif;fill:#101828}
      .h{font:700 22px Arial, sans-serif;fill:#101828}
      .t{font:16px Arial, sans-serif;fill:#344054}
      .s{font:14px Arial, sans-serif;fill:#475467}
      .arrow{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#667085;stroke-width:3;fill:none;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="850"/>
  <text class="title" x="60" y="64">Archon: Agentic Financial Intelligence on Nebius Serverless AI</text>
  <rect class="zone" x="60" y="105" width="430" height="620" rx="18"/>
  <text class="h" x="90" y="145">Browser Edge</text>
  <rect class="firebase" x="100" y="185" width="330" height="105" rx="14"/>
  <text class="h" x="130" y="226">React Frontend</text>
  <text class="t" x="130" y="254">Firebase Hosting</text>
  <rect class="firebase" x="100" y="350" width="330" height="115" rx="14"/>
  <text class="h" x="130" y="391">Firebase BFF</text>
  <text class="t" x="130" y="419">/api/** proxy and browser TLS</text>
  <rect class="zone" x="560" y="105" width="780" height="620" rx="18"/>
  <text class="h" x="590" y="145">Nebius Services</text>
  <rect class="nebius" x="605" y="185" width="300" height="115" rx="14"/>
  <text class="h" x="635" y="226">FastAPI Backend</text>
  <text class="t" x="635" y="254">CPU AI Endpoint</text>
  <rect class="nebius" x="605" y="365" width="300" height="125" rx="14"/>
  <text class="h" x="635" y="404">Extraction Job</text>
  <text class="t" x="635" y="432">CPU AI Job, on demand</text>
  <text class="s" x="635" y="458">4-stage document pipeline</text>
  <rect class="nebius" x="605" y="550" width="300" height="125" rx="14"/>
  <text class="h" x="635" y="589">Analysis Job</text>
  <text class="t" x="635" y="617">CPU AI Job, on demand</text>
  <text class="s" x="635" y="643">7-stage reporting pipeline</text>
  <rect class="data" x="980" y="185" width="290" height="95" rx="14"/>
  <text class="h" x="1010" y="225">Object Storage</text>
  <text class="t" x="1010" y="252">raw, extracted, reports</text>
  <rect class="model" x="980" y="325" width="290" height="110" rx="14"/>
  <text class="h" x="1010" y="365">Inference API</text>
  <text class="t" x="1010" y="392">Qwen2.5-VL + Llama 3.3</text>
  <rect class="data" x="980" y="480" width="290" height="95" rx="14"/>
  <text class="h" x="1010" y="520">Container Registry</text>
  <text class="t" x="1010" y="547">backend + job images</text>
  <rect class="data" x="980" y="620" width="290" height="80" rx="14"/>
  <text class="h" x="1010" y="660">Managed PostgreSQL</text>
  <line class="arrow" x1="265" y1="290" x2="265" y2="350"/>
  <line class="arrow" x1="430" y1="407" x2="605" y2="244"/>
  <line class="arrow" x1="755" y1="300" x2="755" y2="365"/>
  <line class="arrow" x1="755" y1="490" x2="755" y2="550"/>
  <line class="arrow" x1="905" y1="242" x2="980" y2="232"/>
  <line class="arrow" x1="905" y1="427" x2="980" y2="232"/>
  <line class="arrow" x1="905" y1="612" x2="980" y2="232"/>
  <line class="dash" x1="905" y1="424" x2="980" y2="382"/>
  <line class="dash" x1="905" y1="610" x2="980" y2="382"/>
  <line class="dash" x1="905" y1="244" x2="980" y2="526"/>
  <line class="arrow" x1="905" y1="244" x2="980" y2="660"/>
  <text class="s" x="60" y="780">Precise claim: Firebase serves the browser edge; Nebius runs backend compute, jobs, inference, storage, registry, and financial data.</text>
</svg>
